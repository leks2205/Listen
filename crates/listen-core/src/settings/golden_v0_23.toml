global_media_keys = true
global_shortcuts = false

[appearance]
theme = "defaultDark"
follow_desktop_theme = true
follow_system_theme = true
theme_dark = "tokyoNight"
theme_light = "defaultLight"
accent = [
    53,
    116,
    252,
]
use_theme_accent = false
font = "Inter"
zoom = 100
scroll_speed = 1.0
album_background_blur = 3.0
artist_background_blur = 3.0

[sidebar]
show_playlists = true
playlist_folders = true
playlist_folder_separator = "/"
show_image = true
show_queue = true
panel_order = [
    "queue",
    "lyrics",
    "visualizer",
]
collapsed = false
cover_expanded = false
width = 400.0
queue_width = 600.0

