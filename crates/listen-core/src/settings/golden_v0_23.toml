[home]
feature = true
sections = [
    "genres",
    "mostPlayed",
    "random",
    "recentlyAdded",
    "recentlyPlayed",
    "recentlyReleased",
    "playlists",
]

[player_bar]
info_items = [
    "codec",
    "release_year",
]
skip_buttons = true
skip_backward_secs = 5
skip_forward_secs = 10
volume_wheel_step = 5
volume_width = 70
button_size = 15

[playback]
gapless = "weak"
crossfade_secs = 0.0
track_fade_secs = 1.5
replay_gain = "no"
replay_gain_preamp_db = 0.0
replay_gain_clip = true
audio_device = "auto"
mpv_extra_args = []
fade_on_pause = true
equalizer_enabled = false
equalizer_preamp = 0.0
stream_quality = "original"
scrobble = true
scrobble_at_percent = 75
scrobble_at_secs = 240
volume = 70

[[playback.equalizer]]
freq = 31.5
gain = 0.0

[[playback.equalizer]]
freq = 63.0
gain = 0.0

[[playback.equalizer]]
freq = 125.0
gain = 0.0

[[playback.equalizer]]
freq = 250.0
gain = 0.0

[[playback.equalizer]]
freq = 500.0
gain = 0.0

[[playback.equalizer]]
freq = 1000.0
gain = 0.0

[[playback.equalizer]]
freq = 2000.0
gain = 0.0

[[playback.equalizer]]
freq = 4000.0
gain = 0.0

[[playback.equalizer]]
freq = 8000.0
gain = 0.0

[[playback.equalizer]]
freq = 16000.0
gain = 0.0

[auto_dj]
enabled = true
item_count = 5
timing = 1
allow_duplicates = false
strategy = "similar"

[ai_dj]
enabled = false
persona = "late_night"
text_model = "gemini-3.5-flash-lite"
tts_model = "gemini-3.8-flash-lite-tts"
set_min = 2
set_max = 5
talk_every = 1
max_voiced_per_day = 15
voice_gain_db = 0.0

[analysis]
enabled = true
analyze_library = true
shared_dir = ""
threads = 0
on_battery = false

[mixing]
enabled = true
flow_select = true
max_tempo_pct = 6.0
long_blend_bars = 16
tempo_ramps = true
bass_swap = true
mix_manual_queue = true
fallback_fade_secs = 4.0

[ripping]
auto_rip = true
destination = "/mnt/nas/Music"
eject_when_done = true
notify_sound = true
replay_gain = true
scan_navidrome = true
picker_timeout_secs = 30

[history]
enabled = true
retention = "forever"

[lyrics]
fetch = true
follow = true
alignment = "center"
font_size = 24.0
gap = 24.0
opacity_non_active = 0.2
sources = [
    "NetEase",
    "lrclib.net",
]
delay_ms = 0

[visualizer]
mode = 10
gradient = "prism"
fft_size = 16384
min_freq = 20.0
max_freq = 22050.0
min_db = -85.0
max_db = -25.0
smoothing = 0.6
peak_line = true
line_width = 1.9
fill_alpha = 0.0
in_queue_panel = true

[hotkeys]
globalSearch = "mod+k"
listNavigateToPage = "mod+g"
listPlayDefault = "enter"
listShowPlayingSong = "mod+l"
localSearch = "mod+f"
playPause = "space"

[global_hotkeys]
next = "CTRL+ALT+Right"
playPause = "CTRL+ALT+space"
previous = "CTRL+ALT+Left"
stop = ""
volumeDown = "CTRL+ALT+Down"
volumeMute = "CTRL+ALT+m"
volumeUp = "CTRL+ALT+Up"

[window]
tray = true
minimize_to_tray = false
exit_to_tray = false
start_minimized = false
custom_title_bar = true
title_bar_track_info = true
discord_rpc = false
discord_client_id = "1165957668758900787"
